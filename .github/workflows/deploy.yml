name: Publicar Oração Acessível na Locaweb
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: oracao-acessivel-locaweb
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enviar arquivos por FTP
        uses: locaweb/ftp-deploy@1.0.0
        with:
          host: ${{ secrets.HOST }}
          user: ${{ secrets.USER }}
          password: ${{ secrets.PASS }}
          localDir: "./"
          remoteDir: "./public_html/oracaoacessivel/"
